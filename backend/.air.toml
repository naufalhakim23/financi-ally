# air hot-reload config — `make dev`.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
bin = "./tmp/server"
include_ext = ["go", "yaml", "env", "tpl", "tmpl", "sql"]
exclude_dir = ["tmp", "bin", "vendor"]
exclude_regex = ["_test.go"]
delay = 300
stop_on_error = true

[log]
time = false

# oapi-codegen config — single source of truth for the API surface.
# `make gen` regenerates api/generated.go from openapi.yaml.
#
# M1: strict-server flipped on. The first typed request/response endpoints
# (register/login/refresh/google/me/logout) need the typed binding strict gives;
# the handler now returns typed response objects instead of writing JSON by hand.
package: api
output: api/generated.go
output-options:
  skip-prune: true
generate:
  models: true
  chi-server: true
  strict-server: true
  client: false
  embedded-spec: false

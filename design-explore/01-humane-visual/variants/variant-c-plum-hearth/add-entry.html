<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant C — Plum hearth — Add entry</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Outfit', 'sans-serif'],
        mono: ['"IBM Plex Mono"', 'monospace'],
      },
      colors: {
        desk: '#E5DBE1',
        canvas: '#F7F2F5',
        surface: '#FFFFFF',
        well: '#F3EDF1',
        track: '#E9E1E6',
        ink: '#241B22',
        dim: '#655A61',
        faint: '#786C74',
        outline: '#E8DFE4',
        outlinev: '#F1EAEF',
        plum: '#8E4585',
        'plum-deep': '#753A6E',
        'plum-press': '#5F2F5A',
        'plum-wash': '#F5EAF2',
        'plum-tint': '#EBD9E7',
        'plum-edge': '#DFC6DA',
        success: '#15803D',
        expense: '#B91C1C',
        'warning-text': '#8F5200',
      },
    }
  }
}
</script>
<style>
  body { background:
    radial-gradient(1100px 620px at 78% -8%, #EFE2EB 0%, rgba(239,226,235,0) 62%),
    #E5DBE1;
  }
  .num { font-family: "IBM Plex Mono", monospace; font-variant-ligatures: none; }
  .phone { box-shadow: 0 28px 64px -26px rgba(78,42,72,.32), 0 2px 8px rgba(78,42,72,.08); }
  .soft-shadow { box-shadow: 0 6px 20px -14px rgba(78,42,72,.24); }
  .card-shadow { box-shadow: 0 8px 26px -18px rgba(117,58,110,.20), 0 1px 2px rgba(36,27,34,.04); }
  .fab-shadow { box-shadow: 0 10px 26px -8px rgba(142,69,133,.45); }
  .press:active { transform: scale(.97); }
  .press { transition: transform .12s cubic-bezier(.2,0,0,1), background-color .15s ease, border-color .15s ease, color .15s ease; }
  a:focus-visible, button:focus-visible { outline: 2px solid #753A6E; outline-offset: 2px; border-radius: 12px; }
  .row-hover { transition: background-color .15s ease; }
  .row-hover:hover { background: #F8F3F6; }
  .row-hover:active { background: #F0E8ED; }
  .navcard a { transition: color .15s ease, background-color .15s ease; }
  .navcard a:hover { color: #753A6E; background: #F5EAF2; }
  .key { transition: background-color .12s ease, transform .12s cubic-bezier(.2,0,0,1); }
  .key:hover { background: #F5EAF2; }
  .key:active { background: #EBD9E7; transform: scale(.96); }
  .caret { display:inline-block; width:2px; height:1em; background:#8E4585; margin-left:3px; vertical-align:-0.12em; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .catchip { transition: background-color .15s ease, border-color .15s ease; }
  .catchip:hover { border-color: #DFC6DA; }
</style>
</head>
<body class="min-h-screen font-sans text-ink antialiased">

<!-- floating cross-nav -->
<nav class="navcard fixed top-5 right-5 z-50 w-52 rounded-2xl bg-surface/95 backdrop-blur border border-track p-3 soft-shadow text-[13px]">
  <p class="px-2 pb-1.5 font-semibold text-ink">C · Plum hearth</p>
  <p class="px-2 pb-1 text-[11px] uppercase tracking-[0.08em] text-faint">This variant</p>
  <a href="index.html" class="block px-2 py-1 rounded-lg text-dim">Home</a>
  <a href="add-entry.html" class="block px-2 py-1 rounded-lg font-semibold text-plum-deep bg-plum-wash">Add entry</a>
  <a href="reports.html" class="block px-2 py-1 rounded-lg text-dim">Reports</a>
  <p class="px-2 pt-2 pb-1 text-[11px] uppercase tracking-[0.08em] text-faint">Add entry in</p>
  <a href="../variant-a-morning-air/add-entry.html" class="block px-2 py-1 rounded-lg text-dim">A · Morning air</a>
  <a href="../variant-b-sea-glass/add-entry.html" class="block px-2 py-1 rounded-lg text-dim">B · Sea glass</a>
</nav>

<!-- phone frame -->
<div class="phone mx-auto my-10 w-[390px] h-[844px] rounded-[44px] bg-canvas ring-1 ring-black/5 overflow-hidden relative flex flex-col">

  <main class="flex-1 overflow-y-auto px-5 pt-6 pb-5 flex flex-col [&>*]:shrink-0">

    <!-- header -->
    <div class="flex items-center justify-between">
      <h1 class="text-[22px] font-bold tracking-[-0.01em] text-plum-deep">Add entry</h1>
      <a href="index.html" aria-label="Close" class="press grid place-items-center w-9 h-9 rounded-full bg-surface border border-outline text-dim hover:text-plum-deep">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </a>
    </div>

    <!-- segmented -->
    <div class="mt-4 grid grid-cols-3 gap-1 rounded-full bg-track p-1">
      <button class="press rounded-full bg-surface py-2 text-[13.5px] font-semibold text-plum-deep shadow-sm">Out</button>
      <button class="press rounded-full py-2 text-[13.5px] font-medium text-faint hover:text-dim">In</button>
      <button class="press rounded-full py-2 text-[13.5px] font-medium text-faint hover:text-dim">Move</button>
    </div>

    <!-- amount well -->
    <div class="mt-4 rounded-[20px] bg-well px-5 py-6 text-center">
      <p class="text-[11px] font-semibold uppercase tracking-[0.09em] text-faint">Amount</p>
      <p class="num mt-2 text-[36px] leading-none font-bold tracking-[-0.02em] text-ink">
        <span class="text-[19px] font-medium text-faint align-[0.32em] mr-1.5">IDR</span>28,000<span class="caret" aria-hidden="true"></span>
      </p>
    </div>

    <!-- category rail: tinted glyph tiles, selected carries its own hue -->
    <div class="mt-4 -mx-5 px-5 flex gap-2 overflow-x-auto pb-1" style="scrollbar-width:none">
      <!-- Eating out, selected -->
      <button class="press catchip shrink-0 flex items-center gap-2 rounded-full h-10 pl-1.5 pr-3.5 border-[1.5px]" style="background:rgba(235,104,52,.14); border-color:rgba(235,104,52,.55);">
        <span class="grid place-items-center w-7 h-7 rounded-full" style="background:rgba(235,104,52,.2); color:#B44A18;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg>
        </span>
        <span class="text-[13px] font-semibold" style="color:#9A3E12;">Eating out</span>
      </button>
      <!-- Groceries -->
      <button class="press catchip shrink-0 flex items-center gap-2 rounded-full h-10 pl-1.5 pr-3.5 bg-surface border border-outline">
        <span class="grid place-items-center w-7 h-7 rounded-full" style="background:rgba(42,120,214,.12); color:#1D5FAE;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        </span>
        <span class="text-[13px] font-medium text-dim">Groceries</span>
      </button>
      <!-- Transport -->
      <button class="press catchip shrink-0 flex items-center gap-2 rounded-full h-10 pl-1.5 pr-3.5 bg-surface border border-outline">
        <span class="grid place-items-center w-7 h-7 rounded-full" style="background:rgba(27,175,122,.13); color:#0E7A54;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
        </span>
        <span class="text-[13px] font-medium text-dim">Transport</span>
      </button>
      <!-- Fun -->
      <button class="press catchip shrink-0 flex items-center gap-2 rounded-full h-10 pl-1.5 pr-3.5 bg-surface border border-outline">
        <span class="grid place-items-center w-7 h-7 rounded-full" style="background:rgba(232,123,164,.16); color:#B0416B;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
        </span>
        <span class="text-[13px] font-medium text-dim">Fun</span>
      </button>
      <!-- Bills -->
      <button class="press catchip shrink-0 flex items-center gap-2 rounded-full h-10 pl-1.5 pr-3.5 bg-surface border border-outline">
        <span class="grid place-items-center w-7 h-7 rounded-full" style="background:rgba(237,161,0,.15); color:#8F5F00;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
        </span>
        <span class="text-[13px] font-medium text-dim">Bills</span>
      </button>
      <!-- + New -->
      <button class="press catchip shrink-0 flex items-center gap-1.5 rounded-full h-10 px-3.5 bg-plum-wash border border-plum-edge text-plum-deep">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        <span class="text-[13px] font-semibold">New</span>
      </button>
    </div>

    <!-- defaults chip + open disclosure -->
    <div class="mt-3">
      <button class="press flex items-center gap-1.5 rounded-full bg-surface border border-outline pl-3.5 pr-2.5 py-2 text-[13px] font-medium text-dim hover:border-plum-edge">
        from BCA · today
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E4585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rotate-180"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <div class="mt-2 rounded-[18px] bg-surface border border-outline card-shadow overflow-hidden">
        <div class="row-hover px-4 py-3 cursor-pointer flex items-center justify-between">
          <p class="text-[13.5px] text-faint">Out of</p>
          <p class="text-[13.5px] font-semibold text-ink flex items-center gap-1.5">BCA
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D9CDD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </p>
        </div>
        <div class="mx-4 border-t border-outlinev"></div>
        <div class="row-hover px-4 py-3 cursor-pointer flex items-center justify-between">
          <p class="text-[13.5px] text-faint">Date</p>
          <p class="text-[13.5px] font-semibold text-ink flex items-center gap-1.5">Today
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D9CDD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </p>
        </div>
        <div class="mx-4 border-t border-outlinev"></div>
        <div class="row-hover px-4 py-3 cursor-pointer flex items-center justify-between">
          <p class="text-[13.5px] text-faint">Note</p>
          <p class="text-[13.5px] font-medium text-faint flex items-center gap-1.5">add a note
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D9CDD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </p>
        </div>
      </div>
    </div>

    <!-- keypad -->
    <div class="mt-auto pt-4 grid grid-cols-3 gap-2">
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">1</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">2</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">3</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">4</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">5</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">6</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">7</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">8</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">9</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[17px] font-medium text-dim">000</button>
      <button class="key num rounded-2xl bg-surface border border-outline py-3.5 text-[20px] font-medium text-ink">0</button>
      <button aria-label="Backspace" class="key rounded-2xl bg-surface border border-outline py-3.5 grid place-items-center text-dim">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" x2="12" y1="9" y2="15"/><line x1="12" x2="18" y1="9" y2="15"/></svg>
      </button>
    </div>

    <!-- save -->
    <button class="press mt-3 w-full rounded-2xl bg-plum py-4 text-[15px] font-semibold text-white hover:bg-plum-deep active:bg-plum-press fab-shadow">Save entry</button>
  </main>
</div>

</body>
</html>

openapi: 3.0.3
info:
  title: FinanciAlly API
  version: 0.2.0
  description: |
    Personal finance double-entry ledger. M1 adds the auth surface
    (register/login/refresh/google + protected me/logout). Accounts, entries,
    lines, budgets, fx, recurring, reporting, and sync land in later milestones;
    the Go server interface is regenerated from this file via `make gen`.
servers:
  - url: http://localhost:8080
    description: local dev
tags:
  - name: system
    description: Health & operational endpoints
  - name: auth
    description: Registration, login, token refresh, OAuth, session
  - name: ledger
    description: Double-entry accounts, entries, and lines
  - name: budget
    description: Monthly category budgets
  - name: sync
    description: WatermelonDB pull/push offline sync
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: Liveness + DB connectivity
      description: |
        Returns 200 with `db:"up"` when Postgres answers, 503 with `db:"down"`
        when it does not. The mobile app uses this to confirm the backend is
        reachable before attempting a sync.
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a credential account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: malformed body or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Rotate a refresh token into a new session
      description: |
        The presented refresh token is revoked and a fresh access+refresh pair
        is returned. A replayed, expired, or forged token yields 401; rotation
        is atomic, so reuse is detected on the second presentation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: rotated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: token invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/google:
    post:
      operationId: googleAuth
      tags: [auth]
      summary: Exchange a Google authorization code for a session
      description: |
        The mobile app runs the authorization-code flow via expo-auth-session and
        sends the resulting authorization code + redirect_uri here. The server
        redeems the code (it is the confidential client holding the Google
        client_secret), verifies the email, and find-or-creates the user. PKCE is
        intentionally not used: the code is exchanged server-side with the secret,
        so there is no code_verifier to thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleRequest'
      responses:
        '200':
          description: session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: code rejected or email unverified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: google oauth not configured on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the presented refresh token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: token revoked
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts:
    post:
      operationId: createAccount
      tags: [ledger]
      summary: Create a pocket or category (chart-of-accounts entry)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
      responses:
        '201':
          description: account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: malformed body or invalid type/currency/name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: an account of this type with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listAccounts
      tags: [ledger]
      summary: List the user's accounts (pockets and categories)
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountType'
      responses:
        '200':
          description: accounts, optionally filtered by type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      tags: [ledger]
      summary: Account debit/credit totals and normal-balance-signed amount
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /entries:
    post:
      operationId: postEntry
      tags: [ledger]
      summary: Post a balanced double-entry transaction
      description: |
        Writes the entry header and its balanced lines in one transaction. The
        balance invariant (sum of debits = sum of credits, per currency) is
        enforced both in-application and by a Postgres trigger; an unbalanced
        entry yields 422. Posted entries are immutable — correct with a
        reversing entry, never an edit. M2 supports single-currency entries;
        cross-currency (FX) entries land in M4.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEntryRequest'
      responses:
        '201':
          description: entry posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          description: malformed body or invalid lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: entry is not balanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listEntries
      tags: [ledger]
      summary: List posted entries with their lines
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: entries newest-first within the optional date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /entries/{id}:
    get:
      operationId: getEntry
      tags: [ledger]
      summary: Fetch one posted entry with its lines
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: the entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /budgets:
    post:
      operationId: setBudget
      tags: [budget]
      summary: Create or update a monthly category budget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBudgetRequest'
      responses:
        '201':
          description: budget set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: malformed body or invalid account/currency/month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listBudgets
      tags: [budget]
      summary: List budgets for a month, with spent amounts
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            format: date
            description: first day of the month e.g. 2026-07-01
      responses:
        '200':
          description: budgets for the month with spent rollup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetWithSpent'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /budgets/{id}:
    put:
      operationId: updateBudget
      tags: [budget]
      summary: Update a budget's target
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetRequest'
      responses:
        '200':
          description: budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteBudget
      tags: [budget]
      summary: Delete a budget
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: budget deleted
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sync/pull:
    post:
      operationId: syncPull
      tags: [sync]
      summary: Pull server changes since a watermark (WatermelonDB native protocol)
      description: |
        WatermelonDB's native pull/push protocol. The mobile provides
        last_pulled_at (the timestamp of its last successful pull); the server
        returns all records created, updated, or soft-deleted after that moment,
        grouped by table. The mobile merges these into its local WatermelonDB
        store. Empty-changeset responses are normal (nothing changed since the
        last pull).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPullRequest'
      responses:
        '200':
          description: changed records grouped by table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sync/push:
    post:
      operationId: syncPush
      tags: [sync]
      summary: Push local changes to the server (WatermelonDB native protocol)
      description: |
        WatermelonDB sends a batch of created/updated/deleted records; the
        server processes them and returns a new timestamp. The protocol is
        idempotent: reapplying the same batch yields no error. Posted entries
        are immutable and their balance invariant is asserted server-side; an
        unbalanced entry returns 422 and the mobile flags it for user review.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: push accepted, new timestamp for next pull
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: unbalanced entry rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          description: process liveness
          example: ok
        db:
          type: string
          enum: [up, down]
          description: Postgres connectivity
          example: up
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: stable machine code for this error class
          example: invalid_credentials
        message:
          type: string
          description: human-readable detail
          example: invalid credentials
    User:
      type: object
      required: [id, email, base_currency, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        base_currency:
          type: string
          description: ISO 4217 currency code
          example: IDR
        created_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
          description: "short-lived HS256 JWT; send as `Authorization: Bearer <token>`"
        refresh_token:
          type: string
          description: single-use opaque token; rotate via /auth/refresh
        user:
          $ref: '#/components/schemas/User'
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        base_currency:
          type: string
          description: optional; defaults to server BASE_CURRENCY_DEFAULT
          example: IDR
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    GoogleRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
          description: authorization code from expo-auth-session
        redirect_uri:
          type: string
          description: the redirect URI the app used in the auth request
    AccountType:
      type: string
      enum: [asset, liability, income, expense, equity]
      description: Chart-of-accounts type. asset/liability are pockets; income/expense/equity are categories.
    Account:
      type: object
      required: [id, type, currency, name, archived, created_at, updated_at]
      properties:
        id:
          type: string
          description: client-generated id (WatermelonDB) or server uuid
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          description: ISO 4217 currency code
          example: IDR
        name:
          type: string
        parent_id:
          type: string
          nullable: true
          description: optional parent account (tree hook; unused in M2)
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewAccountRequest:
      type: object
      required: [type, currency, name]
      properties:
        id:
          type: string
          description: optional client id; server generates a uuid when omitted (REST path)
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          example: IDR
        name:
          type: string
          minLength: 1
          maxLength: 80
        parent_id:
          type: string
          nullable: true
    JournalLine:
      type: object
      required: [id, entry_id, account_id, dc, amount_minor, currency]
      properties:
        id:
          type: string
          description: client-generated id
        entry_id:
          type: string
        account_id:
          type: string
        dc:
          type: string
          enum: [debit, credit]
        amount_minor:
          type: integer
          format: int64
          description: unsigned integer minor units (cents) at the currency's scale
          example: 50000
        currency:
          type: string
          example: IDR
    LineInput:
      type: object
      required: [account_id, dc, amount_minor]
      properties:
        id:
          type: string
          description: optional client id; server generates a uuid when omitted
        account_id:
          type: string
        dc:
          type: string
          enum: [debit, credit]
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: unsigned minor units
        currency:
          type: string
          description: optional; defaults to the entry currency (M4 multi-currency support)
          example: IDR
    Entry:
      type: object
      required: [id, txn_date, status, currency, source, memo, lines, created_at, updated_at]
      properties:
        id:
          type: string
          description: client-generated id or server uuid
        txn_date:
          type: string
          format: date
        status:
          type: string
          enum: [draft, posted]
        currency:
          type: string
          example: IDR
        fx_rate:
          type: string
          nullable: true
          description: cross-currency rate (M4); null for single-currency entries
        source:
          type: string
          enum: [manual, recurring, import]
        memo:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewEntryRequest:
      type: object
      required: [currency, lines]
      properties:
        id:
          type: string
          description: optional client id; server generates a uuid when omitted (REST path)
        txn_date:
          type: string
          format: date
          description: optional; defaults to today
        currency:
          type: string
          example: IDR
        fx_rate:
          type: string
          description: optional cross-currency rate; when set, the balance invariant is enforced in-app (M4)
          example: "15000.00"
        memo:
          type: string
        source:
          type: string
          enum: [manual, recurring, import]
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/LineInput'
    AccountBalance:
      type: object
      required: [account_id, currency, debit_minor, credit_minor, signed_minor]
      properties:
        account_id:
          type: string
        currency:
          type: string
          example: IDR
        debit_minor:
          type: integer
          format: int64
        credit_minor:
          type: integer
          format: int64
        signed_minor:
          type: integer
          format: int64
          description: normal-balance-signed amount (asset/expense = debit−credit; others = credit−debit); positive is healthy/normal
    NewBudgetRequest:
      type: object
      required: [account_id, period_month, target_minor]
      properties:
        id:
          type: string
          description: optional client id; server generates a uuid when omitted
        account_id:
          type: string
        period_month:
          type: string
          format: date
          description: first day of the month e.g. 2026-07-01
        target_minor:
          type: integer
          format: int64
          description: budgeted amount in minor units
    Budget:
      type: object
      required: [id, account_id, period_month, target_minor, currency, created_at, updated_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        period_month:
          type: string
          format: date
        target_minor:
          type: integer
          format: int64
        currency:
          type: string
          example: IDR
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BudgetWithSpent:
      type: object
      required: [id, account_id, period_month, target_minor, spent_minor, currency, created_at, updated_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        period_month:
          type: string
          format: date
        target_minor:
          type: integer
          format: int64
        spent_minor:
          type: integer
          format: int64
          description: actual spending so far this month
        currency:
          type: string
          example: IDR
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateBudgetRequest:
      type: object
      required: [target_minor]
      properties:
        target_minor:
          type: integer
          format: int64
    SyncPullRequest:
      type: object
      required: [last_pulled_at]
      properties:
        last_pulled_at:
          type: integer
          format: int64
          description: server timestamp of the last successful pull; 0 for initial sync
    SyncChanges:
      type: object
      description: map of table name -> changes, conforming to WatermelonDB protocol
      additionalProperties:
        $ref: '#/components/schemas/SyncTableChanges'
    SyncTableChanges:
      type: object
      properties:
        created:
          type: array
          items:
            type: object
        updated:
          type: array
          items:
            type: object
        deleted:
          type: array
          items:
            type: string
    SyncPullResponse:
      type: object
      required: [changes, timestamp]
      properties:
        changes:
          $ref: '#/components/schemas/SyncChanges'
        timestamp:
          type: integer
          format: int64
          description: server timestamp; client sends this as last_pulled_at on the next pull
    SyncPushRequest:
      type: object
      required: [changes]
      properties:
        changes:
          $ref: '#/components/schemas/SyncChanges'
    SyncPushResponse:
      type: object
      properties:
        errors:
          type: array
          items:

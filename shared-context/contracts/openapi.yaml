openapi: 3.0.3
info:
  title: FinanciAlly API
  version: 0.2.0
  description: |
    Personal finance double-entry ledger. M1 adds the auth surface
    (register/login/refresh/google + protected me/logout). Accounts, entries,
    lines, budgets, fx, recurring, reporting, and sync land in later milestones;
    the Go server interface is regenerated from this file via `make gen`.
servers:
  - url: http://localhost:8080
    description: local dev
tags:
  - name: system
    description: Health & operational endpoints
  - name: auth
    description: Registration, login, token refresh, OAuth, session
  - name: ledger
    description: Double-entry accounts, entries, and lines
  - name: budget
    description: Monthly category budgets
  - name: sync
    description: WatermelonDB pull/push offline sync
  - name: fx
    description: Exchange rates and multi-currency
  - name: reports
    description: Aggregated financial reports
  - name: recurring
    description: RRULE-based recurring transaction rules
  - name: ledgers
    description: Books of accounts, membership, and join codes
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: Liveness + DB connectivity
      description: |
        Returns 200 with `db:"up"` when Postgres answers, 503 with `db:"down"`
        when it does not. The mobile app uses this to confirm the backend is
        reachable before attempting a sync.
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a credential account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: malformed body or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Rotate a refresh token into a new session
      description: |
        The presented refresh token is revoked and a fresh access+refresh pair
        is returned. A replayed, expired, or forged token yields 401; rotation
        is atomic, so reuse is detected on the second presentation.

        `refresh_token` is optional: a browser client posts `{}` and the server
        reads the token from the httpOnly `fa_refresh` cookie instead
        (WEB_COOKIE_AUTH). Mobile keeps sending it in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: rotated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: token invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/google:
    post:
      operationId: googleAuth
      tags: [auth]
      summary: Exchange a Google authorization code for a session
      description: |
        The mobile app runs the authorization-code flow via expo-auth-session and
        sends the resulting authorization code + redirect_uri here. The server
        redeems the code (it is the confidential client holding the Google
        client_secret), verifies the email, and find-or-creates the user. PKCE is
        intentionally not used: the code is exchanged server-side with the secret,
        so there is no code_verifier to thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleRequest'
      responses:
        '200':
          description: session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: code rejected or email unverified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: google oauth not configured on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Email a password-reset code
      description: |
        Always answers 204, registered address or not. The endpoint is
        unauthenticated, so distinguishing the two would turn it into an account
        enumeration oracle. A six-digit code (not a link — the client is a native
        app) is emailed and expires in 15 minutes; issuing a new one retires the
        previous. Five wrong guesses burn the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: if the address is registered, a code is on its way
        '400':
          description: malformed email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using an emailed code
      description: |
        On success the new password is stored, every outstanding refresh token
        for the account is revoked (a reset is the remedy for a compromise), and
        a fresh session is returned so the caller is signed in on this device.
        An account created through Google with no password can use this flow to
        set its first one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: password changed, session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: malformed body or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: code wrong, expired, already used, or too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the presented refresh token
      description: >
        `refresh_token` is optional for the same reason as /auth/refresh — a
        browser posts `{}` and presents the token through the httpOnly
        `fa_refresh` cookie, which this call also clears.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: token revoked
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts:
    post:
      operationId: createAccount
      tags: [ledger]
      summary: Create a pocket or category (chart-of-accounts entry)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
      responses:
        '201':
          description: account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: malformed body or invalid type/currency/name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: an account of this type with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listAccounts
      tags: [ledger]
      summary: List the user's accounts (pockets and categories)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountType'
      responses:
        '200':
          description: accounts, optionally filtered by type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/balances:
    get:
      operationId: listAccountBalances
      tags: [ledger]
      summary: Signed balance for every account in the book
      description: |
        The whole-book balance per account, computed from the full journal.
        Clients must not derive balances from a bounded /entries window — an
        account whose history predates the window would show a wrong figure.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: balances for every non-deleted account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountBalance'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [ledger]
      summary: Rename and/or archive an account
      description: >
        Both fields are optional; omitting one leaves it unchanged, so rename,
        archive and restore are the same call. At least one must be present.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: the updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: malformed body, or neither field supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: an account of this type with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      tags: [ledger]
      summary: Account debit/credit totals and normal-balance-signed amount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /entries:
    post:
      operationId: postEntry
      tags: [ledger]
      summary: Post a balanced double-entry transaction
      description: |
        Writes the entry header and its balanced lines in one transaction. The
        balance invariant (sum of debits = sum of credits, per currency) is
        enforced both in-application and by a Postgres trigger; an unbalanced
        entry yields 422. Posted entries are immutable — correct with a
        reversing entry, never an edit. M2 supports single-currency entries;
        cross-currency (FX) entries land in M4.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEntryRequest'
      responses:
        '201':
          description: entry posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          description: malformed body or invalid lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: entry is not balanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listEntries
      tags: [ledger]
      summary: List posted entries with their lines
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: entries newest-first within the optional date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /entries/{id}:
    get:
      operationId: getEntry
      tags: [ledger]
      summary: Fetch one posted entry with its lines
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: the entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateEntry
      tags: [ledger]
      summary: Relabel a posted entry
      description: >
        The memo is the only mutable field on a posted entry. Amounts, accounts
        and the date *are* the posting — correcting one means deleting the entry
        and posting a new one, which is what the clients do.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntryRequest'
      responses:
        '200':
          description: the updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          description: malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteEntry
      tags: [ledger]
      summary: Remove a posted entry from the ledger
      description: >
        Soft-delete: the row survives for audit, but every read path (balances,
        reports, list, sync pull) filters it out, so the money is gone from the
        book immediately. Idempotent — deleting twice still answers 204.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: entry deleted
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /budgets:
    post:
      operationId: setBudget
      tags: [budget]
      summary: Create or update a monthly category budget
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBudgetRequest'
      responses:
        '200':
          description: budget created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: malformed body or account is not an owned expense account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listBudgets
      tags: [budget]
      summary: List a month's budgets with live spent totals
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: period
          in: query
          required: true
          schema:
            type: string
            format: date
          description: first day of the month (YYYY-MM-01)
      responses:
        '200':
          description: budgets with spent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetWithSpent'
        '400':
          description: missing or invalid period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /budgets/{id}:
    put:
      operationId: updateBudget
      tags: [budget]
      summary: Update a budget's target
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_minor]
              properties:
                target_minor:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        '200':
          description: budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteBudget
      tags: [budget]
      summary: Delete a budget (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: budget deleted
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sync/pull:
    get:
      operationId: syncPull
      tags: [sync]
      summary: Pull changes since a watermark (WatermelonDB)
      description: |
        Returns all records on synced tables (accounts, entries, journal_lines,
        budgets) whose server updated_at is after last_pulled_at, split into
        created/updated/deleted per table, plus a new timestamp watermark. The
        mobile passes the returned timestamp as last_pulled_at on the next pull.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: last_pulled_at
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: change set + new watermark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sync/push:
    post:
      operationId: syncPush
      tags: [sync]
      summary: Push local changes to the server (WatermelonDB)
      description: |
        Applies client-created/updated/deleted records per table. Entries re-run
        the balance invariant; an unbalanced or otherwise invalid pushed entry
        is reported in `errors` keyed by client id, never silently dropped.
        Accepted records get a server updated_at; LWW on metadata mutables.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: apply result with per-record errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /fx/rates:
    get:
      operationId: listFxRates
      tags: [fx]
      summary: List available FX rates
      description: |
        Returns available base currencies and their latest rate dates.
        The mobile calls this to check whether the local rate cache is stale.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: available FX rate bases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRateList'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /fx/rates/refresh:
    post:
      operationId: refreshFxRates
      tags: [fx]
      summary: Trigger a manual FX rate refresh from frankfurter.app
      description: |
        Fetches today's rates for the configured base currencies. Idempotent.
        Returns the number of rates inserted or updated.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: rates refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRefreshResult'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /fx/rates/{base}/{quote}:
    get:
      operationId: getFxRate
      tags: [fx]
      summary: Get the most recent rate for a currency pair
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: base
          in: path
          required: true
          schema:
            type: string
          description: ISO 4217 base currency
        - name: quote
          in: path
          required: true
          schema:
            type: string
          description: ISO 4217 quote currency
        - name: as_of
          in: query
          required: false
          schema:
            type: string
            format: date
          description: optional as-of date (defaults to today)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: the rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRate'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: rate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/net-worth:
    get:
      operationId: getNetWorth
      tags: [reports]
      summary: Net worth (assets minus liabilities) in base currency
      description: |
        Aggregates all asset and liability accounts, converting each to the
        user's base currency using the most recent available FX rate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: net worth breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetWorth'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/spending:
    get:
      operationId: getSpending
      tags: [reports]
      summary: Spending by category for a period
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      security:
        - bearerAuth: []
      responses:
        '200':
          description: spending per category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySpend'
        '400':
          description: invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/cash-flow:
    get:
      operationId: getCashFlow
      tags: [reports]
      summary: Income vs expense for a period, in base currency
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      security:
        - bearerAuth: []
      responses:
        '200':
          description: cash flow summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlow'
        '400':
          description: invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/monthly:
    get:
      operationId: getMonthlySeries
      tags: [reports]
      summary: Income / expense / net per month for the trailing N months
      description: |
        Trailing series ending with the current month, oldest first. Each point
        is normalized to the user's base currency. Drives the monthly trend
        chart on the reports screen.
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      security:
        - bearerAuth: []
      responses:
        '200':
          description: monthly series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySeries'
        '400':
          description: invalid months value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recurring:
    get:
      operationId: listRecurring
      tags: [recurring]
      summary: List the user's recurring transaction rules
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: recurring rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringRule'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createRecurring
      tags: [recurring]
      summary: Create a recurring transaction rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRecurringRuleRequest'
      responses:
        '201':
          description: rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringRule'
        '400':
          description: invalid rrule or template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recurring/{id}:
    get:
      operationId: getRecurring
      tags: [recurring]
      summary: Get one recurring rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: the recurring rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringRule'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateRecurring
      tags: [recurring]
      summary: Update a recurring rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecurringRuleRequest'
      responses:
        '200':
          description: rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringRule'
        '400':
          description: invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteRecurring
      tags: [recurring]
      summary: Delete a recurring rule (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: rule deleted
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recurring/trigger:
    post:
      operationId: triggerRecurring
      tags: [recurring]
      summary: Manually trigger materialization of due recurring rules
      description: |
        Evaluates the authenticated user's active recurring rules and posts
        entries for any that are due (next_run ≤ today), including occurrences
        missed while the scheduler was down. Posting is idempotent per
        (rule, occurrence date), so repeat calls never double-post. Returns the
        count of entries actually created.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: materialization complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringTriggerResult'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ledgers:
    get:
      operationId: listLedgers
      tags: [ledgers]
      summary: List the books this user can open
      description: |
        The personal book comes first and is created on first use, so this
        never returns an empty list for an authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ledgers with the caller's role in each
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerMembership'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createLedger
      tags: [ledgers]
      summary: Create a shared household book
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLedgerRequest'
      responses:
        '201':
          description: ledger created, caller is its owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
        '400':
          description: invalid name or currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ledgers/{id}/members:
    get:
      operationId: listLedgerMembers
      tags: [ledgers]
      summary: List a book's members
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: members, owners first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerMember'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: not a member of this ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ledgers/{id}/members/{userId}:
    delete:
      operationId: removeLedgerMember
      tags: [ledgers]
      summary: Remove a member, or leave the book yourself
      description: |
        Owners may remove anyone; members may remove only themselves. The last
        owner cannot be removed: a book with no owner could never be managed
        again. Idempotent: removing a non-member returns 204.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: member removed
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: owner role required, or removing the last owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ledgers/{id}/invite:
    post:
      operationId: createLedgerInvite
      tags: [ledgers]
      summary: Issue a join code for a household book
      description: |
        Owner-only. Issuing a code revokes any previous one for the book, so
        there is exactly one live code at a time.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: join code issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerInvite'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: owner role required, or the book is personal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ledgers/join:
    post:
      operationId: joinLedger
      tags: [ledgers]
      summary: Join a book with a code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinLedgerRequest'
      responses:
        '200':
          description: joined; the ledger is now selectable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown, expired, or revoked code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    LedgerId:
      name: X-Ledger-Id
      in: header
      required: false
      description: |
        Which book this request reads and writes. Omit for the caller's personal
        ledger. A ledger the caller is not a member of is rejected with 403.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Ledger:
      type: object
      required: [id, name, base_currency, kind, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        base_currency:
          type: string
          description: the book's reporting currency; reports normalize to it
          example: IDR
        kind:
          type: string
          enum: [personal, household]
        created_at:
          type: string
          format: date-time
    LedgerMembership:
      type: object
      required: [ledger, role]
      properties:
        ledger:
          $ref: '#/components/schemas/Ledger'
        role:
          $ref: '#/components/schemas/LedgerRole'
    LedgerRole:
      type: string
      enum: [owner, member]
      description: owners manage membership and invites; members do everything else
    LedgerMember:
      type: object
      required: [user_id, email, role, joined_at]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/LedgerRole'
        joined_at:
          type: string
          format: date-time
    LedgerInvite:
      type: object
      required: [code, ledger_id, expires_at]
      properties:
        code:
          type: string
          description: short human-typeable join code
          example: K7M2QX9B
        ledger_id:
          type: string
        expires_at:
          type: string
          format: date-time
    NewLedgerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        base_currency:
          type: string
          description: defaults to the creator's own base currency
          example: IDR
    JoinLedgerRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    HealthStatus:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          description: process liveness
          example: ok
        db:
          type: string
          enum: [up, down]
          description: Postgres connectivity
          example: up
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: stable machine code for this error class
          example: invalid_credentials
        message:
          type: string
          description: human-readable detail
          example: invalid credentials
    User:
      type: object
      required: [id, email, base_currency, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        base_currency:
          type: string
          description: ISO 4217 currency code
          example: IDR
        created_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
          description: "short-lived HS256 JWT; send as `Authorization: Bearer <token>`"
        refresh_token:
          type: string
          description: single-use opaque token; rotate via /auth/refresh
        user:
          $ref: '#/components/schemas/User'
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        base_currency:
          type: string
          description: optional; defaults to server BASE_CURRENCY_DEFAULT
          example: IDR
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: >
            Omit (post `{}`) when the caller is a browser relying on the
            httpOnly fa_refresh cookie. Mobile always sends it.
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [email, code, password]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: the six-digit code from the reset email
          pattern: '^[0-9]{6}$'
        password:
          type: string
          format: password
          minLength: 8
    GoogleRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
          description: authorization code from expo-auth-session
        redirect_uri:
          type: string
          description: the redirect URI the app used in the auth request
    AccountType:
      type: string
      enum: [asset, liability, income, expense, equity]
      description: Chart-of-accounts type. asset/liability are pockets; income/expense/equity are categories.
    Account:
      type: object
      required: [id, type, currency, name, archived, created_at, updated_at]
      properties:
        id:
          type: string
          description: client-generated id (WatermelonDB) or server uuid
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          description: ISO 4217 currency code
          example: IDR
        name:
          type: string
        parent_id:
          type: string
          nullable: true
          description: optional parent account (tree hook; unused in M2)
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewAccountRequest:
      type: object
      required: [type, currency, name]
      properties:
        id:
          type: string
          description: optional client id; server generates a uuid when omitted (REST path)
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          example: IDR
        name:
          type: string
          minLength: 1
          maxLength: 80
        parent_id:
          type: string
          nullable: true
    UpdateAccountRequest:
      type: object
      description: >
        Every field optional; an omitted field is left unchanged. Supplying
        neither is a 400 — an empty patch is a mistake, not a no-op.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        archived:
          type: boolean
    UpdateEntryRequest:
      type: object
      required: [memo]
      properties:
        memo:
          type: string
          maxLength: 500
    JournalLine:
      type: object
      required: [id, entry_id, account_id, dc, amount_minor, currency]
      properties:
        id:
          type: string
          description: client-generated id
        entry_id:
          type: string
        account_id:
          type: string
        dc:
          type: string
          enum: [debit, credit]
        amount_minor:
          type: integer
          format: int64
          description: unsigned integer minor units (cents) at the currency's scale
          example: 50000
        currency:
          type: string
          example: IDR
    LineInput:
      type: object
      required: [account_id, dc, amount_minor]
      properties:
        id:
          type: string
          description: optional client id; server generates a uuid when omitted
        account_id:
          type: string
        dc:
          type: string
          enum: [debit, credit]
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: unsigned minor units
        currency:
          type: string
          description: optional; defaults to the entry currency (M4 multi-currency support)
          example: IDR
    Entry:
      type: object
      required: [id, txn_date, status, currency, source, memo, lines, created_at, updated_at]
      properties:
        id:
          type: string
          description: client-generated id or server uuid
        txn_date:
          type: string
          format: date
        status:
          type: string
          enum: [draft, posted]
        currency:
          type: string
          example: IDR
        fx_rate:
          type: string
          nullable: true
          description: cross-currency rate (M4); null for single-currency entries
        source:
          type: string
          enum: [manual, recurring, import]
        memo:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewEntryRequest:
      type: object
      required: [currency, lines]
      properties:
        id:
          type: string
          description: optional client id; server generates a uuid when omitted (REST path)
        txn_date:
          type: string
          format: date
          description: optional; defaults to today
        currency:
          type: string
          example: IDR
        fx_rate:
          type: string
          description: optional cross-currency rate; when set, the balance invariant is enforced in-app (M4)
          example: "15000.00"
        memo:
          type: string
        source:
          type: string
          enum: [manual, recurring, import]
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/LineInput'
    AccountBalance:
      type: object
      required: [account_id, currency, debit_minor, credit_minor, signed_minor]
      properties:
        account_id:
          type: string
        currency:
          type: string
          example: IDR
        debit_minor:
          type: integer
          format: int64
        credit_minor:
          type: integer
          format: int64
        signed_minor:
          type: integer
          format: int64
          description: normal-balance-signed amount (asset/expense = debit−credit; others = credit−debit); positive is healthy/normal
    Budget:
      type: object
      required: [id, account_id, period_month, target_minor, currency, created_at, updated_at]
      properties:
        id:
          type: string
        account_id:
          type: string
          description: the expense account (category) this budget targets
        period_month:
          type: string
          format: date
          description: first day of the month (YYYY-MM-01)
        target_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          example: IDR
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewBudgetRequest:
      type: object
      required: [account_id, period_month, target_minor]
      properties:
        id:
          type: string
          description: optional client id; server generates a uuid when omitted
        account_id:
          type: string
        period_month:
          type: string
          format: date
          description: must be the first day of a month
        target_minor:
          type: integer
          format: int64
          minimum: 0
    BudgetWithSpent:
      type: object
      required: [id, account_id, period_month, target_minor, spent_minor, currency, created_at, updated_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        period_month:
          type: string
          format: date
        target_minor:
          type: integer
          format: int64
        spent_minor:
          type: integer
          format: int64
          description: live total of posted debit lines on the account this month
        currency:
          type: string
          example: IDR
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SyncChanges:
      type: object
      description: |
        Per-table change buckets. Keys are table names: accounts, entries,
        journal_lines, budgets. Each table maps to created/updated/deleted.
      additionalProperties:
        $ref: '#/components/schemas/SyncTableChanges'
    SyncTableChanges:
      type: object
      properties:
        created:
          type: array
          items:
            type: object
            additionalProperties: true
        updated:
          type: array
          items:
            type: object
            additionalProperties: true
        deleted:
          type: array
          items:
            type: string
    SyncPullResponse:
      type: object
      required: [changes, timestamp]
      properties:
        changes:
          $ref: '#/components/schemas/SyncChanges'
        timestamp:
          type: integer
          format: int64
          description: new watermark; pass as last_pulled_at on the next pull
    SyncPushRequest:
      type: object
      required: [changes]
      properties:
        changes:
          $ref: '#/components/schemas/SyncChanges'
    FxRate:
      type: object
      required: [base, quote, day, rate, source]
      properties:
        base:
          type: string
          example: USD
        quote:
          type: string
          example: IDR
        day:
          type: string
          format: date
        rate:
          type: string
          description: decimal rate (1 base = rate quote)
          example: "15000.00"
        source:
          type: string
          example: frankfurter
    FxRateList:
      type: object
      required: [rates, as_of]
      properties:
        rates:
          type: array
          items:
            $ref: '#/components/schemas/FxRate'
        as_of:
          type: string
          format: date
    FxRefreshResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          description: number of rates inserted or updated
    NetWorth:
      type: object
      required: [base_currency, as_of_date, total_asset, total_liability, net_minor]
      properties:
        base_currency:
          type: string
        as_of_date:
          type: string
          format: date-time
        total_asset:
          $ref: '#/components/schemas/NormalizedAmount'
        total_liability:
          $ref: '#/components/schemas/NormalizedAmount'
        net_minor:
          type: integer
          format: int64
    NormalizedAmount:
      type: object
      required: [raw_minor, currency, base_minor]
      properties:
        raw_minor:
          type: integer
          format: int64
          description: total in the original currencies
        currency:
          type: string
          description: the base currency used for normalization
        base_minor:
          type: integer
          format: int64
          description: total normalized to base currency
    CategorySpend:
      type: object
      required: [account_id, account_name, currency, spent_minor, base_minor]
      properties:
        account_id:
          type: string
        account_name:
          type: string
        currency:
          type: string
        spent_minor:
          type: integer
          format: int64
        base_minor:
          type: integer
          format: int64
    CashFlow:
      type: object
      required: [base_currency, period_start, period_end, income_minor, expense_minor, net_minor]
      properties:
        base_currency:
          type: string
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        income_minor:
          $ref: '#/components/schemas/NormalizedAmount'
        expense_minor:
          $ref: '#/components/schemas/NormalizedAmount'
        net_minor:
          type: integer
          format: int64
    MonthlySeries:
      type: object
      required: [base_currency, points]
      properties:
        base_currency:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyPoint'
    MonthlyPoint:
      type: object
      required: [month, income_minor, expense_minor, net_minor]
      properties:
        month:
          type: string
          format: date
          description: first day of the month
        income_minor:
          type: integer
          format: int64
        expense_minor:
          type: integer
          format: int64
        net_minor:
          type: integer
          format: int64
    RecurringRule:
      type: object
      required: [id, ledger_id, rrule, template, active, created_at, updated_at]
      properties:
        id:
          type: string
        ledger_id:
          type: string
        rrule:
          type: string
          description: iCalendar RRULE string (e.g. "FREQ=MONTHLY;BYMONTHDAY=1")
          example: "FREQ=MONTHLY;BYMONTHDAY=1"
        template:
          $ref: '#/components/schemas/RecurringTemplate'
        next_run:
          type: string
          format: date
          nullable: true
          description: next scheduled occurrence date
        last_run:
          type: string
          format: date
          nullable: true
          description: most recent materialized occurrence date
        active:
          type: boolean
        last_error:
          type: string
          nullable: true
          description: >
            why the most recent materialization failed (e.g. the template's
            account was archived); null once the rule posts successfully again
        last_error_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RecurringTemplate:
      type: object
      required: [currency, lines]
      properties:
        currency:
          type: string
          example: IDR
        memo:
          type: string
        source:
          type: string
          default: recurring
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/RecurringLineTemplate'
    RecurringLineTemplate:
      type: object
      required: [account_id, dc, amount_minor]
      properties:
        account_id:
          type: string
        dc:
          type: string
          enum: [debit, credit]
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          description: optional; defaults to the template currency
    NewRecurringRuleRequest:
      type: object
      required: [rrule, template]
      properties:
        id:
          type: string
          description: optional client id; server generates a uuid when omitted
        rrule:
          type: string
          example: "FREQ=MONTHLY;BYMONTHDAY=1"
        template:
          $ref: '#/components/schemas/RecurringTemplate'
        active:
          type: boolean
          default: true
    UpdateRecurringRuleRequest:
      type: object
      required: [rrule, template]
      properties:
        rrule:
          type: string
        template:
          $ref: '#/components/schemas/RecurringTemplate'
        active:
          type: boolean
    RecurringTriggerResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          description: number of entries materialized
    SyncPushResponse:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: string
          description: per-client-id error message for rejected records (never silently dropped)
